<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="24" fill="url(#bg1)" />
  <circle cx="95" cy="95" r="145" fill="#10b981" opacity="0.14" />
  <circle cx="710" cy="285" r="165" fill="#fbbf24" opacity="0.12" />
  <rect x="18" y="18" width="764" height="324" rx="20" fill="none" stroke="url(#gold1)" stroke-width="3" opacity="0.85" />

  <!-- Top Header Pill -->
  <rect x="210" y="28" width="380" height="38" rx="19" fill="#064e3b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="400" y="53" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="18" font-weight="bold" fill="#fde047" text-anchor="middle">
    🌟 رتہ کلاں جھنگ پورٹل — فائدہ اور استعمال (سلائیڈ 1)
  </text>

  <!-- Main Pair 1 Card -->
  <rect x="44" y="84" width="712" height="172" rx="20" fill="#042f2e" stroke="#34d399" stroke-width="2" opacity="0.95" />
  <text x="728" y="140" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="23" font-weight="bold" fill="#fef08a" text-anchor="end">
    استعمال: گاؤں کے مستری، مزدور، دکاندار اور ڈاکٹر ایک جگہ تلاش کریں۔
  </text>
  <text x="728" y="208" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="23" font-weight="bold" fill="#a7f3d0" text-anchor="end">
    فائدہ: روزگار اور کام گھر بیٹھے ملتا ہے۔
  </text>

  <!-- Bottom Feature Badges -->
  <rect x="44" y="274" width="712" height="48" rx="14" fill="#fbbf24" />
  <text x="400" y="305" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="17" font-weight="bold" fill="#022c22" text-anchor="middle">
    🔨 مستری و مزدور  •  🩺 ڈاکٹر و ہسپتال  •  🛒 دکاندار  •  🚜 زرعی ٹریکٹر
  </text>
