<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg2)" />
  <circle cx="400" cy="200" r="250" fill="url(#glow2)" />
  <rect x="28" y="24" width="744" height="352" rx="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Center Focal Illustration: Smartphone Portal Guide -->
  <g transform="translate(400, 185)">
    <rect x="-58" y="-95" width="116" height="190" rx="22" fill="#022c22" stroke="#fbbf24" stroke-width="3.5" />
    <rect x="-46" y="-75" width="92" height="145" rx="12" fill="#064e3b" />
    <!-- Search Bar & Profile Cards inside Phone Screen -->
    <rect x="-36" y="-62" width="72" height="16" rx="8" fill="#fde047" />
    <rect x="-36" y="-36" width="72" height="28" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1.5" />
    <circle cx="22" cy="-22" r="7" fill="#34d399" />
    <rect x="-28" y="-26" width="38" height="8" rx="4" fill="#a7f3d0" />

    <rect x="-36" y="0" width="72" height="28" rx="6" fill="#022c22" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="22" cy="14" r="7" fill="#38bdf8" />
    <rect x="-28" y="10" width="38" height="8" rx="4" fill="#bae6fd" />

    <!-- Call & WhatsApp Action Pills inside Screen -->
    <rect x="-36" y="38" width="33" height="18" rx="6" fill="#10b981" />
    <rect x="3" y="38" width="33" height="18" rx="6" fill="#f59e0b" />
    <circle cx="0" cy="82" r="5" fill="#fbbf24" />
  </g>

  <!-- Left Step Node: Search & Voice -->
  <g transform="translate(200, 185)">
