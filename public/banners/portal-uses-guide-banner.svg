    <circle cx="-4" cy="-4" r="16" fill="none" stroke="#fde047" stroke-width="4" />
    <line x1="8" y1="8" x2="20" y2="20" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Right Step Node: Direct Call & Connect -->
  <g transform="translate(600, 185)">
    <circle cx="0" cy="0" r="52" fill="#0f172a" stroke="#34d399" stroke-width="2.5" />
    <path d="M-14 -12 C-14 8 4 20 16 14 L22 8 L12 -2 L6 4 C-2 0 -6 -6 -2 -12 L4 -18 L-6 -24 Z" fill="#34d399" />
  </g>

  <line x1="252" y1="185" x2="342" y2="185" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="458" y1="185" x2="548" y2="185" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 6" />
