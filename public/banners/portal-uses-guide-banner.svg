<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="24" fill="url(#bg2)" />
  <rect x="18" y="18" width="764" height="324" rx="20" fill="none" stroke="url(#gold2)" stroke-width="3" opacity="0.85" />

  <!-- Top Header Pill -->
  <rect x="200" y="28" width="400" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="400" y="53" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="18" font-weight="bold" fill="#7dd3fc" text-anchor="middle">
    📲 رتہ کلاں جھنگ پورٹل — اوقات اور سہولت (سلائیڈ 2)
  </text>

  <!-- Main Pair 2 Card -->
  <rect x="44" y="84" width="712" height="172" rx="20" fill="#022c22" stroke="#38bdf8" stroke-width="2" opacity="0.95" />
  <text x="728" y="140" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="23" font-weight="bold" fill="#fef08a" text-anchor="end">
    استعمال: مسجد، اسکول، ہسپتال اور گاڑیوں کے اوقات دیکھیں۔
  </text>
  <text x="728" y="208" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="23" font-weight="bold" fill="#a7f3d0" text-anchor="end">
    فائدہ: وقت اور پیسہ بچتا ہے۔
  </text>

  <!-- Bottom Strip -->
  <rect x="44" y="274" width="712" height="48" rx="14" fill="#0284c7" />
  <text x="400" y="305" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">
    🕌 اوقاتِ نماز  •  🏫 اسکول ٹائم ٹیبل  •  🏥 ہسپتال  •  🚐 جھنگ گاڑیاں و وینز
  </text>
