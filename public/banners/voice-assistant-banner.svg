<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg3)" />
  <circle cx="400" cy="200" r="240" fill="url(#glow3)" />
  <rect x="28" y="24" width="744" height="352" rx="24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.45" />

  <!-- Soundwave Bars Left & Right of Center Microphone -->
  <g transform="translate(400, 195)">
    <!-- Left Audio Waves -->
    <rect x="-190" y="-20" width="10" height="40" rx="5" fill="#34d399" opacity="0.6" />
    <rect x="-165" y="-42" width="10" height="84" rx="5" fill="#fbbf24" opacity="0.8" />
    <rect x="-140" y="-64" width="10" height="128" rx="5" fill="#fde047" />
    <rect x="-115" y="-34" width="10" height="68" rx="5" fill="#34d399" opacity="0.9" />

    <!-- Right Audio Waves -->
    <rect x="105" y="-34" width="10" height="68" rx="5" fill="#34d399" opacity="0.9" />
    <rect x="130" y="-64" width="10" height="128" rx="5" fill="#fde047" />
    <rect x="155" y="-42" width="10" height="84" rx="5" fill="#fbbf24" opacity="0.8" />
    <rect x="180" y="-20" width="10" height="40" rx="5" fill="#34d399" opacity="0.6" />

    <!-- Center Microphone Emblem -->
    <circle cx="0" cy="0" r="78" fill="#022c22" stroke="#fbbf24" stroke-width="3.5" />
    <circle cx="0" cy="0" r="60" fill="#065f46" opacity="0.7" />
    <!-- Mic Capsule -->
    <rect x="-16" y="-38" width="32" height="50" rx="16" fill="#fde047" />
    <!-- Mic Stand Arc -->
    <path d="M-28 -8 C-28 18 28 18 28 -8" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="14" x2="0" y2="34" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
    <line x1="-18" y1="34" x2="18" y2="34" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
