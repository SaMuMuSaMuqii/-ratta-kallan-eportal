<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="24" fill="url(#bg3)" />
  <rect x="18" y="18" width="764" height="324" rx="20" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.85" />

  <!-- Microphone Illustration -->
  <circle cx="120" cy="170" r="64" fill="#f59e0b" opacity="0.2" />
  <circle cx="120" cy="170" r="46" fill="#fbbf24" />
  <text x="120" y="186" font-size="42" text-anchor="middle">🎙️</text>

  <!-- Top Header Pill -->
  <rect x="235" y="28" width="520" height="38" rx="19" fill="#022c22" stroke="#fbbf24" stroke-width="1.5" />
  <text x="495" y="53" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="18" font-weight="bold" fill="#fde047" text-anchor="middle">
    🎙️ بول کر تلاش کریں — صوتی مددگار (سلائیڈ 3)
  </text>

  <!-- Main Pair 3 Card -->
  <rect x="210" y="84" width="546" height="172" rx="20" fill="#022c22" stroke="#fbbf24" stroke-width="2" opacity="0.95" />
  <text x="732" y="140" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="end">
    استعمال: بول کر سوال پوچھیں، لکھنا ضروری نہیں۔
  </text>
  <text x="732" y="208" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="21" font-weight="bold" fill="#a7f3d0" text-anchor="end">
    فائدہ: ان پڑھ بھائی بہن بھی آسانی سے استعمال کر سکتے ہیں۔
  </text>

  <!-- Bottom Strip -->
  <rect x="44" y="274" width="712" height="48" rx="14" fill="#10b981" />
  <text x="400" y="305" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="17" font-weight="bold" fill="#022c22" text-anchor="middle">
    🔊 اردو، پنجابی اور رومن اردو میں بول کر پوچھیں اور جواب آواز میں سنیں
  </text>
</svg>
